</head>
<body>

<header>
    <a href="1.html" class="logo">Cyflame</a>

    <!-- Tombol hamburger yang akan muncul di layar HP -->
    <div class="menu-icon" id="menu-bar">
        <i class="fas fa-bars"></i>
    </div>

    <!-- Navigasi Utama -->
    <nav id="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="project.html" class="active">Project</a>
        <a href="achievement.html">Achievement</a>

<section class="projects">
    <h1 class="title">My Projects</h1>

    <div class="project-container">
        <!-- Kartu 1 -->
        <div class="project-card">
            <img src="GameCloud icon.png" alt="Space Shooter Game">

<!-- JavaScript Ringan untuk memicu menu aktif saat di-klik di HP -->
<script>
    const menuBar = document.getElementById('menu-bar');
    const navbar = document.getElementById('navbar');

    menuBar.onclick = () => {
        navbar.classList.toggle('active');
        // Mengubah ikon menjadi 'X' saat menu terbuka
        menuBar.querySelector('i').classList.toggle('fa-times');
    }
</script>
</body>
